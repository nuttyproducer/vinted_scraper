[project]
name = "vinted-price-research"
version = "0.1.0"
description = "Local web app to search Vinted and export selected items to PDF."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "reportlab>=4.2",
    "jinja2>=3.1",
    "pillow>=10.0",
    "httpx>=0.27",
    "vinted_scraper",
]

[tool.uv.sources]
vinted_scraper = { path = "..", editable = true }
